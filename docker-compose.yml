services:

  surveillance-mysql:
    image: mysql:8.0
    container_name: surveillance-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes:
      - surveillance_mysql_data:/var/lib/mysql
    networks:
      - surveillance_net
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  surveillance-ops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: surveillance-ops
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      MYSQL_HOST: surveillance-mysql
      MYSQL_PORT: 3306
    ports:
      - "127.0.0.1:3010:3000"
    depends_on:
      surveillance-mysql:
        condition: service_healthy
    networks:
      - surveillance_net

networks:
  surveillance_net:
    name: surveillance_net

volumes:
  surveillance_mysql_data:
    name: surveillance_mysql_data
